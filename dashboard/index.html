<style>
  @font-face { font-family: 'FSPixel'; src: url('/pxfont/FSPixelSansUnicode-Regular.ttf') format('truetype'); font-display: swap; }
  :root { --cyan: #22d3ee; --amber: #fbbf24; --emerald: #34d399; --purple: #a78bfa; --red: #f87171; --slate: #64748b; }
  html, body { height: 100%; }
  body { margin: 0; background: #090d16; color: #cbd5e1; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
  .glass { background: linear-gradient(180deg, rgba(21,29,48,.72), rgba(9,13,22,.78)); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(148,163,184,.14); box-shadow: 0 0 0 1px rgba(34,211,238,.04) inset, 0 20px 50px -20px rgba(0,0,0,.7); }
  .scanlines::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  .grid-bg { background-image: linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px); background-size: 28px 28px; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .1rem .5rem; font: 600 10px/1.6 'JetBrains Mono', monospace; letter-spacing: .04em; text-transform: uppercase; border: 1px solid currentColor; white-space: nowrap; }
  .pulse-dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 70%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .neon-text { text-shadow: 0 0 12px color-mix(in srgb, currentColor 60%, transparent); }
  .btn { display: inline-flex; align-items: center; gap: .45rem; border-radius: .7rem; padding: .45rem .8rem; font: 600 12px/1 'Space Grotesk', sans-serif; letter-spacing: .02em; transition: .15s; border: 1px solid rgba(148,163,184,.2); background: rgba(30,41,59,.55); color: #e2e8f0; }
  .btn:hover { border-color: rgba(34,211,238,.6); color: #fff; box-shadow: 0 0 18px -6px rgba(34,211,238,.7); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-cyan { background: linear-gradient(180deg, rgba(34,211,238,.25), rgba(8,145,178,.2)); border-color: rgba(34,211,238,.55); color: #cffafe; }
  .btn-amber { background: linear-gradient(180deg, rgba(251,191,36,.22), rgba(180,83,9,.18)); border-color: rgba(251,191,36,.55); color: #fef3c7; }
  .btn-red { background: rgba(248,113,113,.14); border-color: rgba(248,113,113,.5); color: #fecaca; }
  .tab { font: 700 11px/1 'Orbitron', sans-serif; letter-spacing: .12em; padding: .8rem .2rem; border-bottom: 2px solid transparent; color: #64748b; }
  .tab[aria-selected="true"] { color: #e0f2fe; border-color: var(--cyan); text-shadow: 0 0 12px rgba(34,211,238,.6); }
  .card { border-radius: .9rem; border: 1px solid rgba(148,163,184,.14); background: rgba(15,23,42,.6); }
  .thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; } .thin-scroll::-webkit-scrollbar-thumb { background: rgba(100,116,139,.35); border-radius: 8px; } .thin-scroll::-webkit-scrollbar-track { background: transparent; }
  .term-line { font: 12px/1.65 'JetBrains Mono', monospace; white-space: pre-wrap; word-break: break-word; }
  .caret::after { content: '▋'; animation: blink 1s steps(1) infinite; color: var(--cyan); }
  @keyframes blink { 50% { opacity: 0; } }
  .modal-backdrop { background: rgba(2,6,15,.72); backdrop-filter: blur(6px); }
  .tooltip { position: relative; } .tooltip[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; font: 500 11px 'Space Grotesk'; background: #0b1220; border: 1px solid rgba(148,163,184,.25); color: #e2e8f0; padding: .35rem .55rem; border-radius: .5rem; z-index: 60; pointer-events: none; }
  #viewport { cursor: grab; touch-action: none; } #viewport.dragging { cursor: grabbing; } #viewport.hovering { cursor: pointer; }
  .toast { animation: toastIn .25s ease-out; } @keyframes toastIn { from { transform: translateY(8px); opacity: 0; } }
  .spin { animation: spin 1.2s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
  @media (max-width: 1023px) { #drawer { position: fixed; inset: auto 0 0 0; height: 72vh; transform: translateY(calc(100% - 52px)); transition: transform .3s ease; z-index: 40; border-radius: 1.2rem 1.2rem 0 0; } #drawer.open { transform: translateY(0); } }
</style>

<body class="font-body">
<div class="flex h-full flex-col">

  <!-- ============ TOP COMMAND HUD ============ -->
  <header class="glass scanlines relative z-30 mx-2 mt-2 rounded-2xl px-3 py-2 sm:mx-3 sm:px-4">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
      <div class="flex min-w-0 items-center gap-3">
        <div class="relative grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-orange-400/40 bg-gradient-to-br from-orange-500/30 to-red-900/30 shadow-[0_0_24px_-6px_rgba(251,146,60,.8)]">
          <i data-lucide="orbit" class="h-5 w-5 text-orange-200"></i>
        </div>
        <div class="min-w-0">
          <div class="font-pixel text-[15px] tracking-[.12em] text-white sm:text-[18px]">ARES-I <span class="text-orange-300">TASK COMMAND</span></div>
          <div class="flex flex-wrap items-center gap-x-3 font-mono text-[10.5px] text-slate-400">
            <span id="clock">UTC --:--:--</span><span id="sol" class="text-orange-300/80">SOL ----</span>
            <span id="atmo" class="flex items-center gap-1.5 text-emerald-300"><span class="pulse-dot"></span><span id="atmoText">ATMOSPHERE: STABLE</span></span>
          </div>
        </div>
      </div>

      <label class="relative ml-auto flex items-center gap-2 lg:ml-4">
        <span class="sr-only">Project</span>
        <i data-lucide="satellite-dish" class="pointer-events-none absolute left-2.5 h-4 w-4 text-cyan-300"></i>
        <select id="projectSelect" class="appearance-none rounded-xl border border-cyan-400/30 bg-space-800/80 py-2 pl-8 pr-8 font-mono text-[12px] text-cyan-100 outline-none focus:border-cyan-300"></select>
        <i data-lucide="chevrons-up-down" class="pointer-events-none absolute right-2.5 h-3.5 w-3.5 text-slate-400"></i>
      </label>

      <div class="order-last grid w-full grid-cols-2 gap-2 sm:grid-cols-4 lg:order-none lg:ml-auto lg:w-auto">
        <div class="card px-3 py-1.5"><div class="font-hud text-[9px] tracking-[.18em] text-slate-500">AGENTS</div><div class="font-mono text-sm text-cyan-200"><span id="mAgents">0</span><span class="text-slate-500"> online</span></div></div>
        <div class="card px-3 py-1.5"><div class="font-hud text-[9px] tracking-[.18em] text-slate-500">TOKEN COST</div><div class="font-mono text-sm text-amber-200" id="mCost">$0.00</div></div>
        <div class="card px-3 py-1.5"><div class="font-hud text-[9px] tracking-[.18em] text-slate-500">BUILD TIMER</div><div class="font-mono text-sm text-emerald-200" id="mTimer">--:--:--</div></div>
        <div class="card flex items-center px-3 py-1.5"><span id="mStatus" class="chip text-slate-300"><span class="pulse-dot"></span>BOOTING</span></div>
      </div>

      <div class="flex items-center gap-2">
        <button id="audioBtn" class="btn tooltip" data-tip="Sound FX" aria-pressed="false"><i data-lucide="volume-x" class="h-4 w-4"></i></button>
        <button id="reviewBtn" class="btn btn-cyan"><i data-lucide="radar" class="h-4 w-4"></i><span id="reviewLabel">Trigger Reviewers</span></button>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="relative flex min-h-0 flex-1 gap-3 p-2 sm:p-3">
    <!-- Simulation viewport -->
    <section class="glass relative min-w-0 flex-1 overflow-hidden rounded-2xl">
      <canvas id="viewport" class="absolute inset-0 h-full w-full" aria-label="Pixel office simulation. Click a crew member to inspect them, or a room to zoom in."></canvas>

      <div class="pointer-events-none absolute inset-x-0 top-0 flex flex-wrap items-start justify-between gap-2 p-3">
        <nav id="quickNav" class="pointer-events-auto flex max-w-full gap-1 overflow-x-auto rounded-xl border border-slate-500/20 bg-space-900/70 p-1 backdrop-blur thin-scroll" aria-label="Jump to bay"></nav>
        <div class="pointer-events-auto flex gap-1 rounded-xl border border-slate-500/20 bg-space-900/70 p-1 backdrop-blur">
          <button id="xrayBtn" class="btn tooltip !px-2.5 !py-1.5" data-tip="X-ray / HUD mode" aria-pressed="false"><i data-lucide="scan-eye" class="h-4 w-4"></i></button>
          <button id="zoomIn" class="btn tooltip !px-2.5 !py-1.5" data-tip="Zoom in"><i data-lucide="zoom-in" class="h-4 w-4"></i></button>
          <button id="zoomOut" class="btn tooltip !px-2.5 !py-1.5" data-tip="Zoom out"><i data-lucide="zoom-out" class="h-4 w-4"></i></button>
        </div>
      </div>

      <div class="pointer-events-none absolute bottom-3 left-3 right-3 flex flex-wrap items-end justify-between gap-2">
        <div id="legend" class="pointer-events-auto flex flex-wrap gap-1.5 rounded-xl border border-slate-500/20 bg-space-900/70 p-1.5 backdrop-blur"></div>
        <div class="rounded-lg border border-slate-500/20 bg-space-900/70 px-2.5 py-1.5 font-mono text-[10px] text-slate-400 backdrop-blur">
          <span id="feedBadge" class="text-emerald-300">● LIVE FEED</span> · drag to pan · scroll to zoom · click crew or rooms
        </div>
      </div>
    </section>

    <!-- Right drawer -->
    <aside id="drawer" class="glass flex w-full flex-col overflow-hidden rounded-2xl lg:w-[420px] lg:shrink-0">
      <button id="drawerHandle" class="flex items-center justify-center gap-2 py-3 font-hud text-[10px] tracking-[.2em] text-slate-400 lg:hidden"><i data-lucide="grip-horizontal" class="h-4 w-4"></i>TASKS & TERMINAL</button>
      <div class="flex gap-5 border-b border-slate-500/15 px-4" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="tasks">TASK QUEUE <span id="taskCount" class="ml-1 text-slate-500"></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="term">TERMINAL <span id="logCount" class="ml-1 text-slate-500"></span></button>
      </div>

      <div id="panel-tasks" class="thin-scroll flex-1 space-y-4 overflow-y-auto p-3"></div>

      <div id="panel-term" class="hidden min-h-0 flex-1 flex-col">
        <div class="flex flex-wrap items-center gap-1.5 border-b border-slate-500/15 px-3 py-2">
          <div id="levelFilters" class="flex gap-1"></div>
          <select id="agentFilter" class="ml-auto rounded-lg border border-slate-500/25 bg-space-800 px-2 py-1 font-mono text-[11px] text-slate-300"></select>
          <button id="followBtn" class="btn !px-2 !py-1 tooltip" data-tip="Auto-scroll" aria-pressed="true"><i data-lucide="arrow-down-to-line" class="h-3.5 w-3.5"></i></button>
        </div>
        <div id="terminal" class="thin-scroll grid-bg min-h-0 flex-1 overflow-y-auto bg-space-950/70 px-3 py-2"></div>
      </div>
    </aside>
  </main>
</div>

<!-- Modals -->
<div id="modalRoot" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop" role="dialog" aria-modal="true">
  <div id="modalBox" class="glass scanlines relative max-h-[88vh] w-full max-w-2xl overflow-hidden rounded-2xl"></div>
</div>
<div id="toasts" class="pointer-events-none fixed bottom-4 left-1/2 z-[60] flex w-[min(92vw,420px)] -translate-x-1/2 flex-col gap-2"></div>

<script>
/* =====================================================================================
   ARES-I TASK COMMAND — Success Manager dashboard.
   Live data from `sm dashboard` (/api/*). Opened as a plain file it runs a demo feed.
   ===================================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icons = () => window.lucide && lucide.createIcons();

/* ---------------- Crew roster ---------------- */
const CREW = {
  orchestrator: { name: 'ARES', role: 'Orchestrator', color: '#7dd3fc', bay: 'control', icon: 'crown',
    bio: 'Runs the station. Schedules reviewer sweeps, hands the queue to the builder, and calls a human when the loop needs one. Never grades its own crew.' },
  builder: { name: 'FORGE', role: 'Builder · Claude', color: '#fb923c', bay: 'engineering', icon: 'hammer',
    bio: 'The only crew member allowed to change code. Works the task queue in priority order; every time it stops, the QA script decides if it really is done.' },
  code: { name: 'VEGA', role: 'Code & Security Officer', color: '#22d3ee', bay: 'engineering', icon: 'shield-check',
    bio: 'Read-only reviewer. Hunts crashes, races, unsafe dependencies, missing error handling and leaked secrets.' },
  ui: { name: 'LYRA', role: 'Interface Architect', color: '#a78bfa', bay: 'design', icon: 'palette',
    bio: 'Read-only reviewer. Checks design tokens, layout, clipping, dark mode and how text survives large type sizes.' },
  ux: { name: 'ORION', role: 'Experience Specialist', color: '#f472b6', bay: 'design', icon: 'route',
    bio: 'Read-only reviewer. Walks every flow looking for dead ends, missing loading/empty/error states and accessibility gaps.' },
  functionality: { name: 'ATLAS', role: 'Logic & QA Analyst', color: '#34d399', bay: 'qa', icon: 'flask-conical',
    bio: 'Read-only reviewer. Compares what the code does against what the docs promise; edge cases are its hobby.' },
  marketing: { name: 'NOVA', role: 'Comms & Copy Officer', color: '#fbbf24', bay: 'marketing', icon: 'megaphone',
    bio: 'Read-only reviewer. Reads every word a user sees: clarity, naming, onboarding value, store and SEO text.' },
};
const ORDER = ['orchestrator', 'builder', 'code', 'ui', 'ux', 'functionality', 'marketing'];

/* ---------------- App state ---------------- */
const app = {
  live: false, project: null, projects: [], data: null, logs: [], logKeys: new Set(),
  filters: { levels: new Set(['INFO', 'WARN', 'ERROR']), agent: 'ALL' }, follow: true,
  audio: false, xray: false, hoverAgent: null, lastStatus: null,
};

/* ---------------- Audio FX (Web Audio synth) ---------------- */
let actx = null;
function beep({ f = 880, d = 0.08, type = 'sine', v = 0.05, slide = 0, delay = 0 } = {}) {
  if (!app.audio) return;
  actx ||= new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  click: () => beep({ f: 1320, d: 0.05, type: 'square', v: 0.025 }),
  open: () => { beep({ f: 520, d: 0.09, slide: 400, v: 0.04 }); beep({ f: 1040, d: 0.07, delay: 0.07, v: 0.03 }); },
  log: () => beep({ f: 1900, d: 0.03, type: 'triangle', v: 0.012 }),
  alert: () => { for (let i = 0; i < 3; i++) beep({ f: 660, d: 0.12, type: 'sawtooth', v: 0.03, delay: i * 0.18 }); },
  ok: () => { beep({ f: 660, d: 0.1, v: 0.04 }); beep({ f: 990, d: 0.14, delay: 0.1, v: 0.04 }); },
};

/* ---------------- Data layer (live API or demo) ---------------- */
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-SM': '1', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function boot() {
  let lastErr = null;
  for (let i = 0; i < 4 && !app.live; i++) { // the server may still be starting: retry before falling back to demo data
    try { app.projects = await api('/api/projects'); app.live = true; } catch (e) { lastErr = e; await new Promise((r) => setTimeout(r, 1000)); }
  }
  if (!app.live) {
    app.projects = DEMO.projects();
    toast(`Could not reach the live feed (${lastErr?.message || 'no response'}). Showing demo data: reload to retry.`, 'red');
  }
  $('#feedBadge').textContent = app.live ? '● LIVE FEED' : '◌ DEMO FEED (run `sm dashboard` for live data)';
  $('#feedBadge').className = app.live ? 'text-emerald-300' : 'text-amber-300';
  const saved = (() => { try { return localStorage.getItem('ares.project'); } catch { return null; } })();
  app.project = app.projects.find((p) => p.name === saved)?.name || app.projects[0]?.name || null;
  renderProjects();
  await refresh();
  setInterval(refresh, app.live ? 3000 : 2500);
  if (app.live) setInterval(async () => { try { app.projects = await api('/api/projects'); renderProjects(); } catch {} }, 15000);
}

let refreshing = null; // the project a poll is in flight for
async function refresh() {
  if (!app.project) { renderEmpty(); return; }
  if (refreshing === app.project) return; // never stack polls for one project
  const proj = refreshing = app.project;
  try {
    const d = app.live ? await api(`/api/state?project=${encodeURIComponent(proj)}`) : DEMO.state(proj);
    if (proj !== app.project) return; // user switched project while this was in flight
    app.data = d;
    ingestLogs(d.logs || []);
    renderHUD(); renderTasks(); syncCrew();
  } catch (e) { toast(`Telemetry link error: ${e.message}`, 'red'); }
  finally { if (refreshing === proj) refreshing = null; }
}

function renderProjects() {
  const sel = $('#projectSelect');
  sel.innerHTML = app.projects.map((p) => `<option value="${esc(p.name)}" ${p.name === app.project ? 'selected' : ''}>${esc(p.name)} · ${esc(p.status)}${p.running ? ' · ▶' : ''}</option>`).join('') || '<option>No projects — sm add &lt;path&gt;</option>';
}

$('#projectSelect').addEventListener('change', async (e) => {
  sfx.click();
  app.project = e.target.value;
  try { localStorage.setItem('ares.project', app.project); } catch {}
  app.logs = []; app.logKeys.clear(); $('#terminal').innerHTML = ''; app.lastStatus = null;
  for (const a of crew) { a.override = null; }
  toast(`Hot-swapping telemetry → ${app.project}`, 'cyan');
  await refresh();
});

/* ---------------- HUD ---------------- */
const STATUS_STYLE = {
  IN_PROGRESS: 'text-cyan-300', AWAITING_HUMAN_INPUT: 'text-amber-300', PRODUCTION_READY: 'text-emerald-300', ERROR: 'text-red-300',
};
function renderHUD() {
  const d = app.data;
  const working = d.agents.filter((a) => a.state === 'WORKING').length;
  $('#mAgents').textContent = `${working}/${d.agents.length}`;
  $('#mCost').textContent = `$${(d.cost?.total || 0).toFixed(2)}`;
  $('#mStatus').className = `chip ${STATUS_STYLE[d.status] || 'text-slate-300'}`;
  $('#mStatus').innerHTML = `<span class="pulse-dot"></span>${esc(d.status.replace(/_/g, ' '))}`;
  const qaFail = (d.qa || []).some((q) => !q.ok);
  const atmo = $('#atmo');
  if (qaFail) { atmo.className = 'flex items-center gap-1.5 text-red-300'; $('#atmoText').textContent = 'HULL BREACH: QA FAILING'; }
  else if (d.status === 'AWAITING_HUMAN_INPUT') { atmo.className = 'flex items-center gap-1.5 text-amber-300'; $('#atmoText').textContent = 'PRESSURE: CREW REQUESTS INPUT'; }
  else { atmo.className = 'flex items-center gap-1.5 text-emerald-300'; $('#atmoText').textContent = 'ATMOSPHERE: STABLE'; }
  if (app.lastStatus && app.lastStatus !== d.status) {
    if (d.status === 'AWAITING_HUMAN_INPUT') { sfx.alert(); toast('Crew requests human input', 'amber'); }
    if (d.status === 'PRODUCTION_READY') { sfx.ok(); toast(`${d.project} is PRODUCTION READY`, 'emerald'); }
  }
  app.lastStatus = d.status;
  const rb = $('#reviewBtn');
  rb.disabled = !app.live || Boolean(d.auditing);
  $('#reviewLabel').textContent = d.auditing ? 'Reviewers on shift…' : 'Trigger Reviewers';
}

setInterval(() => {
  const n = new Date();
  $('#clock').textContent = `UTC ${n.toISOString().slice(11, 19)}`;
  const msd = (n.getTime() / 86400000 + 2440587.5 - 2405522.0028779) / 1.0274912517;
  const mtc = ((msd % 1) * 24 + 24) % 24;
  $('#sol').textContent = `SOL ${Math.floor(msd)} · MTC ${String(Math.floor(mtc)).padStart(2, '0')}:${String(Math.floor((mtc % 1) * 60)).padStart(2, '0')}`;
  const d = app.data;
  const t0 = d?.runStartedAt || d?.auditing?.startedAt;
  if (t0) {
    const s = Math.max(0, Math.floor((n - new Date(t0)) / 1000));
    $('#mTimer').textContent = [s / 3600, (s % 3600) / 60, s % 60].map((v) => String(Math.floor(v)).padStart(2, '0')).join(':');
  } else $('#mTimer').textContent = '--:--:--';
}, 500);

/* ---------------- Task queue ---------------- */
const srcOf = (t) => (t.labels || []).find((l) => l.startsWith('src:'))?.slice(4) || 'manual';
const agentOfSrc = (s) => (s.startsWith('audit-') ? s.slice(6) : null);
function taskCard(t, tone, actions) {
  const tones = { red: 'border-red-400/35 bg-red-500/[.06]', amber: 'border-amber-400/35 bg-amber-500/[.06]', cyan: 'border-cyan-400/25 bg-cyan-500/[.04]', slate: 'border-slate-500/20', emerald: 'border-emerald-400/20 bg-emerald-500/[.04]' };

    <summary class="flex cursor-pointer items-start gap-2 p-2.5">

        <div class="mt-1 flex flex-wrap gap-1.5 font-mono text-[10px] text-slate-500">
          <span>${esc(t.id)}</span>${ag ? `<span style="color:${CREW[ag]?.color}">@${esc(CREW[ag]?.name || ag)}</span>` : `<span>from ${esc(src)}</span>`}${status}
        </div>
      </div>
      <i data-lucide="chevron-down" class="mt-0.5 h-4 w-4 shrink-0 text-slate-500 transition group-open:rotate-180"></i>
    </summary>
    <div class="space-y-2 border-t border-slate-500/15 px-2.5 pb-2.5 pt-2">
      ${t.description ? `<pre class="thin-scroll max-h-48 overflow-auto whitespace-pre-wrap rounded-lg bg-space-950/70 p-2 font-mono text-[11px] leading-relaxed text-slate-300">${esc(t.description)}</pre>` : ''}
      ${t.reason ? `<div class="text-[12px] text-emerald-200/90"><b>Closed:</b> ${esc(t.reason)}</div>` : ''}
      ${t.notes ? `<pre class="whitespace-pre-wrap font-mono text-[11px] text-amber-100/80">${esc(t.notes)}</pre>` : ''}
      ${actions ? `<div class="flex flex-wrap gap-2">${actions}</div>` : ''}
    </div>
  </details>`;
}
function section(title, color, icon, items, html, open = true) {
  return `<section>
    <h3 class="mb-2 flex items-center gap-2 font-hud text-[10px] font-bold tracking-[.2em]" style="color:${color}"><i data-lucide="${icon}" class="h-3.5 w-3.5"></i>${title}<span class="ml-auto font-mono text-slate-500">${items.length}</span></h3>

}
function renderTasks() {

  $('#taskCount').textContent = `${critical.length + queue.length}`;

const LEVEL_STYLE = { INFO: 'text-sky-300', WARN: 'text-amber-300', ERROR: 'text-red-300' };
function agentColor(tag) {
  const k = Object.keys(CREW).find((id) => tag.startsWith(id.toUpperCase()) || tag === CREW[id].name);
  return k ? CREW[k].color : tag === 'QA' ? '#34d399' : tag === 'BUILDER' ? CREW.builder.color : tag === 'ORCHESTRATOR' ? CREW.orchestrator.color : '#94a3b8';
}
function fmtTime(ts) { const d = new Date(ts); return isNaN(d) ? '--:--:--' : d.toISOString().slice(11, 19); }
function ingestLogs(lines) {
  let fresh = 0;
  for (const l of lines) {
    const k = `${l.ts}|${l.agent}|${l.msg}`;
    if (app.logKeys.has(k)) continue;
    app.logKeys.add(k); app.logs.push(l); fresh++;
  }
  if (app.logs.length > 800) app.logs.splice(0, app.logs.length - 800);
  if (fresh) { if (app.logs.length !== fresh) sfx.log(); renderTerminal(); }
}
function renderTerminal() {
  const agents = ['ALL', ...new Set(app.logs.map((l) => l.agent))];
  const sel = $('#agentFilter');
  if (sel.options.length !== agents.length) sel.innerHTML = agents.map((a) => `<option ${a === app.filters.agent ? 'selected' : ''}>${esc(a)}</option>`).join('');
  const rows = app.logs.filter((l) => app.filters.levels.has(l.level) && (app.filters.agent === 'ALL' || l.agent === app.filters.agent));
  $('#logCount').textContent = app.logs.length;
  const term = $('#terminal');
  term.innerHTML = rows.map((l) => `<div class="term-line"><span class="text-slate-600">[${fmtTime(l.ts)}]</span> <span style="color:${agentColor(l.agent)}">[${esc(l.agent)}]</span> <span class="${LEVEL_STYLE[l.level]}">${l.level === 'INFO' ? '' : l.level + ' '}</span><span class="text-slate-300">${esc(l.msg)}</span></div>`).join('') + `<div class="term-line caret text-slate-500">ares@habitat:~$ </div>`;
  if (app.follow) term.scrollTop = term.scrollHeight;
}
$('#levelFilters').innerHTML = ['INFO', 'WARN', 'ERROR'].map((lv) => `<button class="chip ${LEVEL_STYLE[lv]}" data-level="${lv}" aria-pressed="true">${lv}</button>`).join('');

    add(14, 'UX AGENT', 'WARN', 'Filed fuel-app-9n8 P2: Confirm before deleting plate lookup');
    add(15, 'MARKETING AGENT', 'INFO', 'Filed fuel-app-o6a P4 [human]: share image + twitter cards');
    add(40, 'BUILDER', 'INFO', 'Injected Firestore transaction around token rotation (fuel-app-3ea)');
    add(90, 'QA', 'INFO', 'iter=1 verdict=CONTINUE qa=kit-tests:pass,app-unit-tests:pass open=7');
    for (let i = 0; i < Math.floor(s / 6); i++) add(600 + i * 6, ['BUILDER', 'QA', 'CODE AGENT', 'ORCHESTRATOR'][i % 4], i % 7 === 3 ? 'WARN' : 'INFO', ['Compiling GasMonitorKit…', 'swift test → 212 passed, 0 failed', 'Re-scanning diff for new races', 'Queue depth nominal'][i % 4]);
    return {
      project: name, status: ready ? 'PRODUCTION_READY' : human ? 'AWAITING_HUMAN_INPUT' : 'IN_PROGRESS',
      qa: [{ name: 'kit-tests', ok: true }, { name: 'app-unit-tests', ok: true }], running: !ready && !human,
      runStartedAt: new Date(start - 252000).toISOString(), auditing: null, cost: { total: 1.13 + s / 900, last: 1.13 }, agents,
      tasks: {
        critical: [],
        required: ready ? [] : [T('fuel-app-xao', 'Hybrid HV-battery SOC: separate hybridBatteryPercent field', 3, 'improvements'), T('fuel-app-uow', 'Kona / Yaris Cross gear decode', 3, 'improvements')],
        human: [T('fuel-app-o6a', 'Add twitter:title/description and a share image', 4, 'audit-marketing', { labels: ['human'] }), T('fuel-app-avp', 'Test the KW901 adapter in both cars', 1, 'readme', { labels: ['human'] })],
        suggestions: [T('fuel-app-dht', 'Home readings arc clips at large text', 3, 'audit-ui', { labels: ['suggestion'] })],
        done: [T('fuel-app-3ea', 'Serialise Tesla refresh-token rotation', 2, 'audit-code', { reason: 'Transaction + re-read retry; tests added' })].map((x) => ({ ...x, status: 'closed' })),
      },
      logs,
    };
  }
  return { projects, state, diff };
})();

function renderEmpty() { $('#panel-tasks').innerHTML = '<div class="p-6 text-center text-slate-400">No managed projects yet.<br><code class="font-mono text-cyan-300">sm add ~/Downloads/Projects/&lt;project&gt; --beads</code></div>'; }

/* boot happens at the end of office.js, once the pixel office is defined */
</script>
